# Construit l'exécutable Windows et l'application macOS sur les machines de GitHub.
# Lancement : onglet « Actions » du dépôt → « Build » → « Run workflow »,
# ou automatiquement en poussant un tag (ex. git tag v0.1.0 && git push --tags).
# Les fichiers .zip sont à télécharger en bas de la page du run (section « Artifacts »).
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      # Un échec sur un système n'annule pas la construction de l'autre
      fail-fast: false
      matrix:
        # macos-latest = Mac Apple Silicon (M1/M2/M3…)
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7

      # Sur Mac, le Python de Homebrew n'a pas tkinter (il est dans un paquet à part) :
      # on force le Python téléchargé par uv, qui inclut tkinter. Windows ne change pas.
      - name: Choisir le Python de uv (macOS)
        if: runner.os == 'macOS'
        run: echo "UV_PYTHON_PREFERENCE=only-managed" >> "$GITHUB_ENV"

      - name: Installer les dépendances
        run: uv sync

      # Si tkinter manque, PyInstaller l'exclut sans échouer et l'app plante au lancement :
      # on préfère arrêter la construction ici avec un message clair.
      - name: Vérifier tkinter (macOS)
        if: runner.os == 'macOS'
        run: |
          uv run python -c "import sys, platform; print(sys.executable, platform.machine())"
          uv run python -c "import tkinter; print('Tcl/Tk', tkinter.Tcl().eval('info patchlevel'))" \
            || { echo "::error::tkinter est absent de ce Python : l'interface ne pourrait pas s'ouvrir."; exit 1; }

      # Les voix Piper ne sont pas dans git (trop lourdes) : on les télécharge ici
      - name: Télécharger les voix hors ligne
        run: uv run python -m piper.download_voices fr_FR-siwis-medium en_US-lessac-medium --data-dir voices

      - name: Construire
        run: uv run pyinstaller lecteur_vocal.spec --noconfirm

      # Une appli fenêtrée qui plante ne dit rien : on la lance pour de vrai et on vérifie
      # qu'elle tourne encore après 20 s ; sinon on affiche sa sortie et le rapport de crash.
      - name: Tester le lancement (macOS)
        if: runner.os == 'macOS'
        run: |
          dist/LecteurVocal.app/Contents/MacOS/LecteurVocal > launch.log 2>&1 &
          PID=$!
          sleep 20
          cat launch.log
          if kill -0 "$PID" 2>/dev/null; then
            echo "L'application tourne toujours : OK"
            kill "$PID"
          else
            echo "L'application s'est arrêtée toute seule"
            for f in ~/Library/Logs/DiagnosticReports/LecteurVocal*; do [ -f "$f" ] && head -120 "$f"; done
            exit 1
          fi

      - name: Zipper (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/LecteurVocal -DestinationPath LecteurVocal-Windows.zip

      - name: Zipper (macOS)
        if: runner.os == 'macOS'
        # ditto conserve les liens symboliques de l'app (un zip classique casserait le .app)
        run: ditto -c -k --keepParent dist/LecteurVocal.app LecteurVocal-macOS.zip

      - uses: actions/upload-artifact@v6
        with:
          name: LecteurVocal-${{ runner.os }}
          path: LecteurVocal-*.zip
