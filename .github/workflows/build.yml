# Construit l'exécutable Windows et l'application macOS sur les machines de GitHub.
# Lancement : onglet « Actions » du dépôt → « Build » → « Run workflow »,
# ou automatiquement en poussant un tag (ex. git tag v0.1.0 && git push --tags).
# Les fichiers .zip sont à télécharger en bas de la page du run (section « Artifacts »).
# Avec un tag, ils sont aussi publiés dans une GitHub Release, avec un lien fixe :
#   https://github.com/garv2309/tts-app/releases/latest/download/LecteurVocal-macOS.zip
#   https://github.com/garv2309/tts-app/releases/latest/download/LecteurVocal-Windows.zip
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      # Un échec sur un système n'annule pas la construction de l'autre
      fail-fast: false
      matrix:
        # macos-14 = Mac Apple Silicon (arm64) sous macOS 14 : le plus ancien système visé,
        # pour que le test de lancement reproduise les Macs de nos utilisateurs
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7

      # Sur Mac, Tcl/Tk 9.0 (Python 3.14 de uv ou de Homebrew) plante au démarrage sur macOS 14
      # (crash dans tkSetMainMenu). Le Python 3.12 de python.org, installé par setup-python,
      # utilise Tcl/Tk 8.6, stable. Windows garde le Python de .python-version.
      - name: Installer Python 3.12 de python.org (macOS)
        if: runner.os == 'macOS'
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Utiliser ce Python avec uv (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "UV_PYTHON=${{ steps.python.outputs.python-path }}" >> "$GITHUB_ENV"
          echo "UV_PYTHON_PREFERENCE=only-system" >> "$GITHUB_ENV"

      - name: Installer les dépendances
        run: uv sync

      # Arrêt immédiat si le Python n'est pas le bon : mieux qu'une app qui plante chez les amis
      - name: Vérifier Python, arm64 et Tk 8.6 (macOS)
        if: runner.os == 'macOS'
        run: |
          uv run python - <<'EOF'
          import platform, sys, tkinter
          # base_prefix = le Python d'origine du .venv (sys.executable pointerait dans .venv)
          print(sys.base_prefix, sys.version.split()[0], platform.machine(), "Tk", tkinter.TkVersion)
          # L'installateur python.org (utilisé par setup-python) installe toujours ici
          if not sys.base_prefix.startswith("/Library/Frameworks/Python.framework/"):
              sys.exit("::error::Mauvais Python : il faut celui de python.org (setup-python).")
          if platform.machine() != "arm64":
              sys.exit(f"::error::Architecture {platform.machine()} au lieu de arm64.")
          if tkinter.TkVersion != 8.6:
              sys.exit(f"::error::Tk {tkinter.TkVersion} au lieu de 8.6 : l'app planterait sur macOS 14.")
          EOF

      # Les voix Piper ne sont pas dans git (trop lourdes) : on les télécharge ici
      - name: Télécharger les voix hors ligne
        run: uv run python -m piper.download_voices fr_FR-siwis-medium en_US-lessac-medium --data-dir voices

      - name: Construire
        run: uv run pyinstaller lecteur_vocal.spec --noconfirm

      # L'appli construite s'ouvre pour de vrai avec --selftest : fenêtre, moteurs, raccourci…
      # puis se ferme seule après 5 s. Code ≠ 0 (exception ou plantage) = le workflow échoue.
      # Les exceptions sont dans le fichier log ; un plantage natif, dans le rapport de crash.
      - name: Selftest de l'application (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: |
          set +e
          dist/LecteurVocal.app/Contents/MacOS/LecteurVocal --selftest
          CODE=$?
          echo "--- ~/Library/Logs/LecteurVocal.log ---"
          cat ~/Library/Logs/LecteurVocal.log
          if [ "$CODE" -ne 0 ]; then
            echo "::error::Selftest échoué (code $CODE)"
            for f in ~/Library/Logs/DiagnosticReports/LecteurVocal*; do [ -f "$f" ] && head -120 "$f"; done
            exit 1
          fi

      - name: Selftest de l'application (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 3
        run: |
          # Appli fenêtrée : Start-Process -Wait attend sa fin et récupère son code de sortie
          $p = Start-Process dist/LecteurVocal/LecteurVocal.exe -ArgumentList "--selftest" -Wait -PassThru
          $log = "dist/LecteurVocal/LecteurVocal.log"
          Write-Output "--- LecteurVocal.log ---"
          Get-Content $log -Encoding utf8
          # Le log du test ne doit pas partir dans le zip des amis
          Remove-Item $log
          if ($p.ExitCode -ne 0) {
            Write-Output "::error::Selftest échoué (code $($p.ExitCode))"
            exit 1
          }

      - name: Zipper (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/LecteurVocal -DestinationPath LecteurVocal-Windows.zip

      - name: Zipper (macOS)
        if: runner.os == 'macOS'
        # ditto conserve les liens symboliques de l'app (un zip classique casserait le .app)
        run: ditto -c -k --keepParent dist/LecteurVocal.app LecteurVocal-macOS.zip

      - uses: actions/upload-artifact@v6
        with:
          name: LecteurVocal-${{ runner.os }}
          path: LecteurVocal-*.zip

  # Publie les zips dans une GitHub Release, seulement quand on pousse un tag (ex. v0.2.0)
  # et seulement si les deux builds (et leurs selftests) ont réussi.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # nécessaire pour créer une release
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true  # met les deux zips dans le même dossier
      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" LecteurVocal-*.zip --repo "$GITHUB_REPOSITORY" --title "Lecteur vocal $GITHUB_REF_NAME" --generate-notes
